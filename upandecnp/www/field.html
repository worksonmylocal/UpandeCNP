<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<title>UpandeCNP Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/upandecnp/css/dashboard.css">
<style>
    /* Text size is a multiplier, not a root font-size: every size below is
       written against --fs so the Settings stepper actually scales the page
       (the old page set a root font-size that nothing in px ever read). */
    :root{
        --fs:1;
        --f10:calc(10px*var(--fs)); --f11:calc(11px*var(--fs)); --f12:calc(12px*var(--fs));
        --f13:calc(13px*var(--fs)); --f135:calc(13.5px*var(--fs)); --f14:calc(14px*var(--fs));
        --f15:calc(15px*var(--fs)); --f16:calc(16px*var(--fs)); --f17:calc(17px*var(--fs));
        --f18:calc(18px*var(--fs)); --f20:calc(20px*var(--fs)); --f22:calc(22px*var(--fs));
        --f24:calc(24px*var(--fs)); --f26:calc(26px*var(--fs)); --f32:calc(32px*var(--fs));
        --bar:0px;
    }
    body.has-bnav{--bar:calc(74px + env(safe-area-inset-bottom,0px))}
    html,body{margin:0}
    body{background:var(--bg);font-family:var(--sans);font-size:var(--f14);color:var(--ink-3);
        -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
    button{font-family:var(--sans)}
    .app{max-width:480px;margin:0 auto;padding:16px 16px calc(40px + var(--bar))}

    /* Header */
    .hdr{display:flex;align-items:center;gap:12px;padding:12px 4px;margin-bottom:8px}
    .hdr__t{flex:1;min-width:0}
    .hdr__t h1{font:600 var(--f17) var(--sans);color:var(--ink);margin:0;letter-spacing:-.2px}
    .hdr__t p{margin:0;font-size:var(--f12);color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hamb{width:40px;height:40px;border:0;background:var(--surface-2);border-radius:50%;display:grid;place-items:center;
        cursor:pointer;box-shadow:var(--shadow-card);flex-shrink:0}
    .hamb svg{stroke:var(--ink)}
    .dotwrap{width:26px;height:26px;border:0;padding:0;border-radius:50%;background:var(--surface-2);
        display:grid;place-items:center;box-shadow:var(--shadow-card);cursor:pointer;flex-shrink:0}
    .cdot{width:8px;height:8px;border-radius:50%;border:2px solid var(--surface-2);box-sizing:content-box}
    .cdot.online{background:var(--good)} .cdot.offline{background:var(--ink-faint)}
    .cdot.noserver{background:var(--bad)} .cdot.checking{background:var(--warn)}

    /* Pills - flat tints, as in the app */
    .fp{display:inline-block;padding:3px 10px;border-radius:999px;font:600 var(--f11) var(--sans);white-space:nowrap;align-self:flex-start}
    .fp.good{background:var(--good-bg);color:var(--good)} .fp.bad{background:var(--bad-bg);color:var(--bad)}
    .fp.warn{background:var(--warn-bg);color:var(--warn)} .fp.info{background:var(--info-bg);color:var(--info)}
    .fp.mute{background:rgba(10,10,10,0.05);color:var(--ink-mute)}

    /* Cards, text, buttons */
    .card{background:var(--surface-2);border-radius:24px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-card)}
    .card h3{margin:0 0 4px;font:600 var(--f16) var(--sans);color:var(--ink)}
    .meta{font-size:var(--f12);color:var(--ink-mute);margin:0 0 12px}
    .lbl{display:block;font-size:var(--f13);color:var(--ink-4);margin-top:6px}
    .fbtn{display:block;width:100%;padding:16px 12px;font:600 var(--f15) var(--sans);border:0;border-radius:14px;
        cursor:pointer;margin-top:8px;text-align:center;transition:transform .1s}
    .fbtn:active{transform:scale(.98)} .fbtn:disabled{opacity:.5;cursor:not-allowed}
    .fbtn.ink{background:var(--grad-ink);color:#fafaf6} .fbtn.signal{background:var(--signal);color:#fafaf6}
    .fbtn.warn{background:var(--warn);color:#fafaf6} .fbtn.good{background:var(--good);color:#fafaf6}
    .fbtn.bad{background:var(--bad);color:#fafaf6} .fbtn.grey{background:rgba(10,10,10,0.06);color:var(--ink-3)}
    .inp{display:block;width:100%;padding:14px 16px;font:400 16px var(--sans);border:1px solid var(--hairline);
        background:var(--surface-2);border-radius:12px;margin:8px 0;color:var(--ink);box-sizing:border-box}
    .inp::placeholder{color:var(--ink-faint)}
    select.inp{appearance:none;-webkit-appearance:none;font-size:var(--f14);padding:12px 36px 12px 14px;
        background-image:linear-gradient(45deg,transparent 50%,var(--ink-mute) 50%),linear-gradient(135deg,var(--ink-mute) 50%,transparent 50%);
        background-position:calc(100% - 18px) calc(50% + 2px),calc(100% - 13px) calc(50% + 2px);
        background-size:5px 5px,5px 5px;background-repeat:no-repeat}
    .back{display:inline-block;color:var(--ink-4);font:600 var(--f13) var(--sans);cursor:pointer;margin:2px 0 14px;
        background:none;border:0;padding:0}
    .nodata{text-align:center;color:var(--ink-mute);padding:34px 0;font-size:var(--f13);line-height:1.5}
    .spinner{text-align:center;padding:34px 0;color:var(--ink-mute);font-size:var(--f13)}
    .spinner::before{content:"";display:block;width:22px;height:22px;margin:0 auto 10px;border:2px solid var(--ink-faint);
        border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Home */
    .greeting{font:600 var(--f20) var(--sans);color:var(--ink);margin:4px 0 2px}
    .greeting-sub{font-size:var(--f13);color:var(--ink-mute);margin-bottom:20px}
    .prog{margin-bottom:16px}
    .prog small{display:block;font:500 var(--f11) var(--sans);letter-spacing:1px;color:var(--ink-mute);margin-bottom:6px}
    .prog select{margin:0}
    .cardhead{display:flex;justify-content:space-between;align-items:flex-end}
    .cardhead b{font:600 var(--f15) var(--sans);color:var(--ink)}
    .pbar{height:26px;border-radius:999px;background:rgba(10,10,10,0.05);overflow:hidden}
    .pbar > div{height:100%;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center;
        font:600 var(--f11) var(--sans);color:#fafaf6;transition:width .6s}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
    .stat{background:var(--surface-2);border-radius:20px;padding:20px;box-shadow:var(--shadow-card)}
    .stat small{display:block;font:500 var(--f11) var(--sans);text-transform:uppercase;letter-spacing:1px;color:var(--ink-mute);margin-bottom:8px}
    .stat b{display:block;font:600 var(--f32) var(--sans);color:var(--ink);letter-spacing:-1px}

    /* Rows */
    .group{margin-bottom:14px}
    .group__head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2);border-radius:16px;
        box-shadow:var(--shadow-card);cursor:pointer;width:100%;border:0;text-align:left}
    .group__head.static{cursor:default}
    .group__head .t{flex:1;min-width:0}
    .group__head b{display:block;font:600 var(--f14) var(--sans);color:var(--ink)}
    .group__head .c{font-size:var(--f12);color:var(--ink-mute);margin-top:2px}
    .group__head .chev{color:var(--ink-mute);font-size:20px;line-height:22px;transition:transform .2s}
    .group__body{padding-top:10px;display:none}
    .group.open .group__body,.group__body.always{display:block}
    .group.open .chev{transform:rotate(90deg)}
    .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface-2);
        box-shadow:var(--shadow-card);margin-bottom:10px}
    .row.tight{padding:12px 16px;margin-bottom:8px}
    .row.top{align-items:flex-start}
    .row .grow{flex:1;min-width:0}
    .row .nm{font:600 var(--f14) var(--sans);color:var(--ink)}
    .row .nm.s13{font-size:var(--f13)}
    .row .sub{font-size:var(--f11);color:var(--ink-mute);margin-top:2px}
    .row.link{cursor:pointer;padding:16px 18px;border-radius:16px}
    .row.link .sub{font-size:var(--f12)}
    .arrow{color:var(--ink-mute);font-size:16px}
    .row.pick{cursor:pointer}
    .row.pick.sel{outline:2px solid var(--ink);outline-offset:-2px}
    .initial{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fafaf6;display:grid;place-items:center;
        font:600 var(--f13) var(--sans);flex-shrink:0;border:0;padding:0}
    .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--hairline);flex-shrink:0;display:grid;place-items:center}
    .sel .check{background:var(--good);border-color:var(--good)}
    .check svg{stroke:#fafaf6;display:none} .sel .check svg{display:block}
    .subhead{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 6px;margin-top:4px}
    .subhead span{font:600 var(--f12) var(--sans);color:var(--ink-4);text-transform:uppercase;letter-spacing:.4px}
    .addchip{width:26px;height:26px;border:0;border-radius:50%;background:var(--ink);color:#fafaf6;font:600 15px var(--sans);
        cursor:pointer;display:grid;place-items:center;line-height:1;padding:0}
    .att{display:flex;gap:6px}
    .att button{border:0;border-radius:8px;padding:8px 10px;font:600 var(--f11) var(--sans);cursor:pointer;
        background:rgba(10,10,10,0.06);color:var(--ink-3)}
    .att button.pres{background:var(--good);color:#fafaf6} .att button.abs{background:var(--bad);color:#fafaf6}
    .titlecard{background:var(--ink);border-radius:24px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-card)}
    .titlecard b{font:600 var(--f16) var(--sans);color:#fff}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
    .planmeta{font-size:var(--f12);color:var(--ink-mute);margin:0 0 12px}
    .plan h3{margin:8px 0 4px}
    .toggle{display:flex;align-items:center;gap:10px;margin:14px 0}
    .toggle svg{flex:none}
    .toggle span{font-size:var(--f14);color:var(--ink-3)}
    .tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .tally div{background:var(--surface-2);border-radius:20px;padding:16px 14px;box-shadow:var(--shadow-card)}
    .tally small{display:block;font:500 var(--f10) var(--sans);letter-spacing:.8px;color:var(--ink-mute);margin-bottom:6px;text-transform:uppercase}
    .tally b{font:600 var(--f26) var(--sans);letter-spacing:-.5px}
    .attgroup .head{background:var(--surface-2);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow-card)}
    .attgroup .head b{display:block;font:600 var(--f14) var(--sans);color:var(--ink)}
    .attgroup .head span{font-size:var(--f12);color:var(--ink-mute)}
    .attgroup .row{margin-top:8px;margin-bottom:0}
    .crewhead{display:flex;align-items:center;justify-content:space-between}
    .crewhead button{border:0;background:none;font:500 var(--f11) var(--sans);color:var(--ink-mute);cursor:pointer}

    /* Settings */
    .stepper{display:flex;align-items:center;gap:12px;margin:10px 0 16px}
    .stepbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;
        box-shadow:var(--shadow-card);cursor:pointer;flex:none}
    .stepbtn:disabled{opacity:.45}
    .preview{flex:1;background:var(--bg);border-radius:14px;padding:10px 14px}
    .preview b{display:block;font:600 var(--f15) var(--sans);color:var(--ink)}
    .preview span{font-size:var(--f12);color:var(--ink-mute)}
    .tgl{display:flex;align-items:center;padding:12px 0;border-top:1px solid var(--hairline);cursor:pointer}
    .tgl .tx{flex:1;padding-right:12px}
    .tgl b{display:block;font:500 var(--f14) var(--sans);color:var(--ink-3)}
    .tgl small{display:block;font-size:var(--f12);color:var(--ink-mute);margin-top:2px}
    .sw{position:relative;width:51px;height:31px;flex:none}
    .sw input{opacity:0;width:0;height:0;position:absolute}
    .sw i{position:absolute;inset:0;background:rgba(10,10,10,0.05);border-radius:999px;transition:.2s}
    .sw i::before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;
        box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
    .sw input:checked + i{background:var(--ink-2)} .sw input:checked + i::before{transform:translateX(20px)}
    .logrow{padding:7px 0;border-top:1px solid var(--hairline)}
    .logrow b{display:block;font:600 var(--f10) var(--sans);letter-spacing:.4px}
    .logrow span{display:block;font-size:11.5px;color:var(--ink-4);line-height:1.4;margin-top:2px;word-break:break-word}
    .connrow{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
    .connrow i{width:10px;height:10px;border-radius:50%;display:inline-block}
    .connrow b{font:600 var(--f13) var(--sans);color:var(--ink-3)}

    /* Drawer */
    .overlay{position:fixed;inset:0;background:rgba(10,10,10,0.52);z-index:99998;opacity:0;pointer-events:none;transition:opacity .2s}
    .overlay.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;left:0;bottom:0;width:244px;background:var(--bg);z-index:99999;transform:translateX(-100%);
        transition:transform .25s;padding:24px 12px 20px;border-radius:0 22px 22px 0;border-right:1px solid var(--hairline);
        overflow-y:auto}
    .drawer.open{transform:translateX(0)}
    .drawer__brand{display:flex;align-items:center;gap:9px;padding:0 10px 14px;margin-bottom:8px;border-bottom:1px solid var(--hairline)}
    .drawer__brand img{height:22px;width:auto} .drawer__brand span{font:600 var(--f13) var(--sans);color:var(--ink)}
    .ditem{display:flex;align-items:center;gap:11px;padding:11px;border-radius:12px;margin-bottom:2px;width:100%;
        border:0;background:transparent;text-align:left;cursor:pointer;font:500 var(--f135) var(--sans);color:var(--ink-3)}
    .ditem.on{background:var(--ink);color:#fafaf6}
    .ditem .em{font-size:14px;width:20px;text-align:center}
    .ditem .tx{flex:1}
    .dsep{height:1px;background:var(--hairline);margin:8px 11px}
    .bubble{width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
    .newsdot{width:7px;height:7px;border-radius:50%;background:var(--info)}
    .dfoot{margin-top:18px;padding:12px 11px 0;border-top:1px solid var(--hairline);font-size:10.5px;color:var(--ink-mute);line-height:1.45;overflow-wrap:anywhere}

    /* Bottom quick bar */
    .bnav{position:fixed;left:0;right:0;bottom:0;z-index:99997;display:none;background:var(--surface-2);
        border-top:1px solid var(--hairline);box-shadow:0 -4px 18px rgba(10,10,10,0.06);
        padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
    body.has-bnav .bnav{display:flex}
    .bnav button{flex:1;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;
        gap:3px;padding:7px 2px;border-radius:12px;color:var(--ink-mute);font:600 var(--f10) var(--sans);letter-spacing:.2px}
    .bnav button.on{color:var(--ink);background:rgba(10,10,10,0.06)}
    .bnav button:active{transform:scale(.94)}
    .bnav svg{width:20px;height:20px}

    .ftoast{position:fixed;left:50%;bottom:calc(var(--bar) + 18px);transform:translateX(-50%);background:var(--ink);color:#fafaf6;
        padding:13px 22px;border-radius:12px;font:500 var(--f14) var(--sans);z-index:100010;opacity:0;pointer-events:none;
        transition:opacity .3s;max-width:90%;text-align:center}
    .ftoast.show{opacity:1}

    /* Confirm dialog */
    .fmodal{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:none;align-items:center;justify-content:center;padding:28px;z-index:100000}
    .fmodal.open{display:flex}
    .dialog{width:100%;max-width:380px;background:var(--surface-2);border-radius:24px;padding:22px;box-shadow:var(--shadow-hover)}
    .dialog h4{margin:0 0 6px;font:600 var(--f18) var(--sans);color:var(--ink)}
    .dialog p{margin:0 0 18px;font-size:var(--f13);color:var(--ink-mute);line-height:1.5}
    .dialog .two{display:flex;gap:10px} .dialog .two .fbtn{margin-top:0}

    /* How to use + What's new sheets */
    .sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:100001}
    .sheet.open{display:flex}
    .sheet__head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:480px;width:100%;margin:0 auto;box-sizing:border-box}
    .sheet__head b{font:600 var(--f18) var(--sans);color:var(--ink);letter-spacing:-.2px}
    .xbtn{border:0;background:none;cursor:pointer;padding:4px}
    .slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
    .slides::-webkit-scrollbar{display:none}
    .slide{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto}
    .slide__in{max-width:480px;margin:0 auto;padding:0 24px 24px}
    .bub{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;margin-bottom:16px}
    .slide h2{margin:0;font:600 var(--f22) var(--sans);color:var(--ink);letter-spacing:-.3px}
    .slide .where{font:500 var(--f11) var(--sans);color:var(--ink-mute);margin:4px 0 24px}
    .hstep{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
    .hstep i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 var(--f11) var(--sans);font-style:normal;flex:none;margin-top:1px}
    .hstep span{flex:1;font-size:var(--f13);color:var(--ink-3);line-height:1.55}
    .tip{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:12px;margin-top:12px;box-shadow:var(--shadow-card)}
    .tip svg{flex:none;margin-top:2px} .tip span{flex:1;font-size:var(--f11);color:var(--ink-4);line-height:1.5}
    .sheet__foot{padding:12px 24px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hairline);background:var(--bg)}
    .sheet__foot > *{max-width:432px;margin-left:auto;margin-right:auto}
    .dots{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:12px}
    .dots i{width:7px;height:7px;border-radius:4px;background:var(--ink-faint);transition:.2s;cursor:pointer}
    .dots i.on{width:20px;background:var(--ink)}
    .next{display:block;width:100%;height:50px;border-radius:14px;border:0;background:var(--ink);color:#fafaf6;font:600 var(--f15) var(--sans);cursor:pointer}
    .cl{position:fixed;inset:0;display:none;flex-direction:column;z-index:100002}
    .cl.open{display:flex}
    .cl__x{position:absolute;right:16px;top:20px;border:0;background:none;cursor:pointer;padding:4px;z-index:2}
    .cl__art{height:240px;display:grid;place-items:center;flex:none}
    .cl__circle{width:136px;height:136px;border-radius:50%;border:1px solid;display:grid;place-items:center}
    .cl__body{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;padding:16px 24px calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
    .cl__top{display:flex;align-items:center;justify-content:space-between}
    .cl__tag{padding:4px 10px;border-radius:999px;border:1px solid;font:600 var(--f11) var(--sans);letter-spacing:.3px}
    .cl__n{font:500 var(--f11) var(--sans);color:rgba(255,255,255,.4)}
    .cl h2{margin:16px 0 0;font:700 var(--f22) var(--sans);color:#fff;letter-spacing:-.3px}
    .cl p{flex:1;margin:8px 0 0;font-size:var(--f15);color:rgba(255,255,255,.73);line-height:1.55}
    .cl .dots{margin:16px 0}
    .cl .dots i{background:rgba(255,255,255,.2)}
    .cl__acts{display:flex;gap:12px;align-items:center}
    .cl__back{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.08);cursor:pointer;display:grid;place-items:center}
    .cl__next{flex:1;height:48px;border-radius:14px;border:0;font:600 var(--f15) var(--sans);color:#0a0a0a;cursor:pointer}

    /* Bigger targets for gloved hands - opt-in from Settings */
    body.big-touch .fbtn{padding:21px 12px}
    body.big-touch .row,body.big-touch .row.tight{padding-top:19px;padding-bottom:19px}
    body.big-touch .att button{padding:12px 16px}
    body.big-touch .bnav button{padding:11px 2px}
    body.big-touch .bnav svg{width:23px;height:23px}
</style>
</head>
<body>

<div class="overlay" id="overlay" data-act="close-drawer"></div>
<aside class="drawer" id="drawer" aria-label="Menu">
    <div class="drawer__brand">
        <img src="/assets/upandecnp/images/upande-logo.png" alt="Upande">

/* ------------------------------------------------------------ Debug log (owner only screen) */
const debugLog = [];
function dbg(level, tag, message) {
    debugLog.unshift({ at: Date.now(), level, tag, message: String(message) });
    if (debugLog.length > 60) debugLog.length = 60;
}

/* ------------------------------------------------------------ Settings */
const DEFAULT_SETTINGS = { fontScale: 100, bigTouch: false, bottomNav: true, confirmSubmit: false };
const FONT_MIN = 85, FONT_MAX = 145, FONT_STEP = 5;

function getSettings() {
    try { return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(store.get(SETTINGS_KEY) || "{}")); }
    catch (e) { return Object.assign({}, DEFAULT_SETTINGS); }
}
function saveSettings(s) { store.set(SETTINGS_KEY, JSON.stringify(s)); applySettings(); }
function applySettings() {

/* ------------------------------------------------------------ Programme */
let selectedProgramme = store.get(PROGRAMME_KEY);
let programmeOptions = [];

function programmeLabel(p) {
    const period = p.period_type === "Custom Period" && p.start_month && p.end_month
        ? p.start_month.slice(0, 3) + "–" + p.end_month.slice(0, 3) : "Full year";
    return p.season + " · " + period;
}
function saveProgrammeSelection(id) {
    selectedProgramme = id || null;
    if (id) store.set(PROGRAMME_KEY, id); else store.del(PROGRAMME_KEY);
}
// A stale selection resolves itself, and a single programme needs no choosing.
function reconcileProgramme(options) {
    programmeOptions = options || [];
    if (selectedProgramme && !programmeOptions.some((o) => o.name === selectedProgramme)) selectedProgramme = null;
    if (!selectedProgramme && programmeOptions.length === 1) selectedProgramme = programmeOptions[0].name;
    saveProgrammeSelection(selectedProgramme);
    return selectedProgramme;
}
function withProgramme(args) {
    if (!selectedProgramme) return args || {};
    return Object.assign({}, args || {}, { programme: selectedProgramme });
}

/* ------------------------------------------------------------ API + offline queue */
function getQueue() { try { return JSON.parse(store.get(QUEUE_KEY) || "[]"); } catch (e) { return []; } }
function setQueue(q) { store.set(QUEUE_KEY, JSON.stringify(q)); updateSyncBadge(); }
function updateSyncBadge() {
    const n = getQueue().length, el = $("sync-badge");
    if (n > 0) { el.style.display = "inline-block"; el.textContent = n + " pending sync"; }
    else el.style.display = "none";
}

function extractServerMessage(data) {
    try {
        if (data._server_messages) {
            const first = JSON.parse(data._server_messages)[0];
            const parsed = typeof first === "string" ? JSON.parse(first) : first;
            if (parsed.message) return String(parsed.message).replace(/<[^>]+>/g, "");
        }
    } catch (e) { /* fall through */ }
    if (data.exception) return String(data.exception).split(":").pop().trim();
    return null;
}

// One round trip. isNetworkError is set only when the request never reached
// the server - the one case that may be queued or served from cache.
async function rawCall(method, args) {
    let res;
    try {
        res = await fetch("/api/method/upandecnp.upandecnp.api." + method, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify(args || {}),
        });
    } catch (e) {
        dbg("error", method, "no connection :: " + ((e && e.message) || e));
        const err = new Error("No connection to the server.");
        err.isNetworkError = true;
        throw err;
    }

    let data;
    try { data = await res.json(); }
    catch (e) {
        // A non-JSON answer is a login page or a platform error page, not data.
        const err = new Error(res.status === 200
            ? "Your session has expired. Please log in again."
            : "Server error (HTTP " + res.status + ").");
        dbg("error", method, "HTTP " + res.status + " non-JSON");
        if (res.status === 200) err.isAuthError = true;
        throw err;
    }

    if (res.status === 401) {
        const err = new Error("Your session has expired. Please log in again.");
        err.isAuthError = true;
        dbg("warn", method, "HTTP 401");
        throw err;
    }
    if (!res.ok || data.exc) {
        // Show the server's own words - a 403 here is a real permission
        // message, not necessarily a dead session.
        const message = extractServerMessage(data) || ("Server error (HTTP " + res.status + ").");
        dbg("error", method, "HTTP " + res.status + " :: " + message);
        throw new Error(message);
    }
    dbg("info", method, "HTTP " + res.status);
    return data.message;
}

let authRedirecting = false;
function handleAuthError(err) {
    if (!err || !err.isAuthError || authRedirecting) return;
    authRedirecting = true;
    toast("Session expired - signing you in again…");
    setTimeout(() => { location.href = "/login?redirect-to=/field"; }, 1200);
}

async function call(method, args) {
    const full = withProgramme(args);
    try {
        const message = await rawCall(method, full);
        store.set(CACHE_PREFIX + method, JSON.stringify({ args: full, message }));
        return message;
    } catch (err) {
        if (err.isNetworkError) {
            const cached = store.get(CACHE_PREFIX + method);
            if (cached) {
                const c = JSON.parse(cached);
                if (JSON.stringify(c.args) === JSON.stringify(full)) return c.message;
            }
        }
        handleAuthError(err);
        throw err;
    }
}

async function writeCall(method, args) {
    const full = withProgramme(args);
    try { return await rawCall(method, full); }
    catch (err) {
        if (!err.isNetworkError) { handleAuthError(err); throw err; }   // queuing would only fail again, silently
        const q = getQueue();
        q.push({ method, args: full, ts: Date.now() });
        setQueue(q);
        const queued = new Error("No connection - saved, will send automatically.");
        queued.queued = true;
        throw queued;
    }
}

async function flushQueue() {
    const q = getQueue();
    if (!q.length) return 0;
    const remaining = [];
    let synced = 0;
    for (const item of q) {
        try { await rawCall(item.method, item.args); synced++; }
        catch (e) { remaining.push(item); }
    }
    setQueue(remaining);
    return synced;
}
async function syncNow(announce) {
    const n = await flushQueue();
    if (n) { toast(n + " pending item" + (n > 1 ? "s" : "") + " synced"); refreshView(); }
    else if (announce) toast("Nothing to sync");
    return n;
}
window.addEventListener("online", () => { syncNow(false); checkConnection(); });
window.addEventListener("offline", checkConnection);
setInterval(() => syncNow(false), 30000);

/* ------------------------------------------------------------ Connection dot */
const CONN_LABEL = { online: "Connected", offline: "No network", noserver: "Server unreachable", checking: "Checking…" };
const CONN_DETAIL = {
    online: "The device has signal and the server is answering.",
    offline: "The device has no network. Anything you record is queued and sent when signal returns.",
    noserver: "The device has signal but the server is not answering. The server may be down.",
    checking: "Checking the connection…",
};
const CONN_COLOUR = { online: "var(--good)", offline: "var(--ink-faint)", noserver: "var(--bad)", checking: "var(--warn)" };
let conn = "checking";

async function pingServer(timeoutMs) {
    const started = Date.now();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs || 8000);
    try {
        const res = await fetch("/api/method/frappe.ping", { signal: controller.signal, credentials: "same-origin" });
        const ms = Date.now() - started;
        dbg("info", "ping", "HTTP " + res.status + " in " + ms + "ms");
        return { ok: true, status: res.status, ms };
    } catch (e) {
        const ms = Date.now() - started;
        const error = (e && e.name === "AbortError") ? "timed out after " + (timeoutMs || 8000) + "ms" : ((e && e.message) || String(e));
        dbg("error", "ping", error);
        return { ok: false, ms, error };
    } finally { clearTimeout(timer); }
}
function setConn(next) {
    conn = next;
    const d = $("conn-dot");
    d.className = "cdot " + next;
    $("conn-btn").setAttribute("aria-label", "Connection: " + CONN_LABEL[next] + ". Tap to re-check.");
    if (nav.view === "settings") paintDiagnosticsConn();
}
async function checkConnection() {
    if (navigator.onLine === false) { setConn("offline"); return; }
    const r = await pingServer();
    setConn(r.ok ? "online" : "noserver");
}
setInterval(checkConnection, 30000);

/* ------------------------------------------------------------ Toast + confirm */
let toastTimer = null;
function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");

let confirmResolve = null;

    $("confirm-title").textContent = title;
    $("confirm-body").textContent = body;

    $("confirm").classList.remove("open");

}
// Ask once more, if the supervisor asked to be asked - at exactly the two
// points that are hard to walk back from a phone in a field.
function confirmIfWanted(title, body) {
    if (!getSettings().confirmSubmit) return Promise.resolve(true);

/* ------------------------------------------------------------ Helpers */
function initials(name) {
    const parts = (name || "?").trim().split(/\s+/);
    return ((parts[0] || "")[0] || "?").toUpperCase() + ((parts[1] || "")[0] || "").toUpperCase();
}
// Item codes mean nothing in the field: lead with the name, keep the code.
function productName(p) { return (p && (p.fertilizer_product_name || p.fertilizer_product)) || ""; }
function productCode(p) { return (p && p.fertilizer_product) || ""; }
const pill = (kind, text) => `<span class="fp ${kind}">${esc(text)}</span>`;
const btn = (label, kind, attrs, disabled) =>

const empty = (t) => `<div class="nodata">${esc(t)}</div>`;
const spinner = (t) => `<div class="spinner">${esc(t || "Loading…")}</div>`;
const backLink = (label, act, extra) => `<button class="back" data-act="${act}" ${extra || ""}>← ${esc(label)}</button>`;

/* ------------------------------------------------------------ Navigation (mirrors the app's nav.ts) */
const TITLES = {
    home: "Home", blocks: "All Blocks", upcoming: "Upcoming Applications", "section-plans": "Section",
    "plan-action": "Application", "store-requests": "Store Requests", team: "Manage Team",
    "applicator-detail": "Applicator", "pick-section": "Choose Section", "pick-block": "Choose Block",
    "add-employee": "Choose Applicator", "record-section": "Record Application", "record-block": "Choose Block",
    "record-plans": "Choose Product", correction: "Correction", attendance: "Attendance", settings: "Settings",
};
const DRAWER = [
    ["home", "🏠", "Home"], ["blocks", "🧱", "All Blocks"], ["upcoming", "⏳", "Upcoming Applications"],
    ["store-requests", "📦", "Store Requests"], ["team", "👷", "Manage Team"], ["record-section", "📝", "Record Application"],
    ["attendance", "🗓️", "Attendance"], ["correction", "🛠️", "Correction"], ["settings", "⚙️", "Settings"],
];
const BOTTOM_NAV = [
    ["home", "home", "Home"], ["upcoming", "clock", "Upcoming"], ["record-section", "edit-3", "Record"],
    ["team", "users", "Team"], ["attendance", "calendar", "Register"],
];

let nav = { view: "home" };
const stack = [{ view: "home" }];
let renderToken = 0;
let roster = {};          // applicators on the team screen, for the detail view
let planStore = {};       // plans by name, so buttons carry a key instead of a JSON blob
let drawerOpen = false;

function go(patch) {
    hideDrawer();
    const next = Object.assign({}, nav, patch);
    const top = stack[stack.length - 1];
    const changed = !top || top.view !== next.view;
    if (changed) stack.push(next);
    if (overlayEntry) {
        // The menu was holding a history entry; it becomes this screen's.
        overlayEntry = false;
        if (changed) history.replaceState({ n: stack.length }, "");
        else { suppressPop++; history.back(); }
    } else if (changed) {
        history.pushState({ n: stack.length }, "");
    }
    nav = next;
    render();
}
function refreshView() {
    // A list can refresh itself under a supervisor; a half-filled form must not.
    if (nav.view === "plan-action" || nav.view === "add-employee") { updateSyncBadge(); return; }
    render();
}
function bump() { render(); }

// While anything covers the page (menu, dialog, sheet) one history entry is
// held for it, so the back button closes that instead of leaving the page.
let overlayEntry = false, suppressPop = 0;
const anyOverlayOpen = () => drawerOpen || ["confirm", "howto", "news"].some((id) => $(id).classList.contains("open"));
function syncEntry() {
    const open = anyOverlayOpen();
    if (open && !overlayEntry) { history.pushState({ o: 1 }, ""); overlayEntry = true; }
    else if (!open && overlayEntry) { overlayEntry = false; suppressPop++; history.back(); }
}

// The browser/phone back button steps back one screen (or closes whatever is
// open) instead of leaving the page mid-shift.
window.addEventListener("popstate", () => {
    if (suppressPop > 0) { suppressPop--; return; }
    if (anyOverlayOpen()) {
        overlayEntry = false;   // the browser just used it up
        if ($("confirm").classList.contains("open")) closeConfirm(false);
        else if ($("howto").classList.contains("open")) closeHowTo();
        else if ($("news").classList.contains("open")) closeNews();
        else hideDrawer();
        syncEntry();
        return;
    }
    if (stack.length > 1) { stack.pop(); nav = stack[stack.length - 1]; render(); }
});

function headerSub() {
    switch (nav.view) {
        case "section-plans": return nav.section || "Section";
        case "pick-block": return nav.pickedSection || "Choose Block";
        case "record-block": return nav.recordSection || "Choose Block";
        case "add-employee": return "Assign to " + (nav.pickedBlock || "block");
        default: return TITLES[nav.view] || "";
    }
}

function hideDrawer() { drawerOpen = false; $("drawer").classList.remove("open"); $("overlay").classList.remove("open"); }
function openDrawer() { drawerOpen = true; $("drawer").classList.add("open"); $("overlay").classList.add("open"); syncEntry(); }
function closeDrawer() { hideDrawer(); syncEntry(); }

function paintChrome() {

function S(tok, html) { if (tok === renderToken) $("screen").innerHTML = html; return tok === renderToken; }

function render() {
    const tok = ++renderToken;
    paintChrome();
    window.scrollTo(0, 0);
    switch (nav.view) {
        case "home": return screenHome(tok);
        case "blocks": return screenBlocks(tok);
        case "upcoming": return screenUpcoming(tok);
        case "section-plans": return screenSectionPlans(tok);

        case "add-employee": return screenAddApplicators(tok);
        case "record-section": return screenRecordSection(tok);
        case "record-block": return screenRecordBlock(tok);

function planUi(p) {
    if (p.status === "Issued") return { pill: "good", text: "Issued — ready to apply", btn: "Record application", kind: "warn", mode: "record" };
    switch (p.request_status) {
        case "Pending Approval": return { pill: "warn", text: "Pending approval", btn: "Show status", kind: "grey", mode: "status" };
        case "Approved": return { pill: "info", text: "Approved — awaiting store issue", btn: "Show status", kind: "grey", mode: "status" };
        case "Draft": return { pill: "warn", text: "Draft — not submitted", btn: "Show status", kind: "grey", mode: "status" };
        case "Rejected": return { pill: "bad", text: "Rejected", btn: "Request again", kind: "ink", mode: "request" };
        case "Cancelled": return { pill: "mute", text: "Cancelled", btn: "Request again", kind: "ink", mode: "request" };
        default: return { pill: "mute", text: "Planned", btn: "Request from store", kind: "ink", mode: "request" };
    }
}

async function sendRequest() {

// Record: pick who applied it (the block's crew is pre-selected), then the form.
let rec = { roster: null, selected: [], step: "who", search: "" };
async function startRecordFlow(tok, back) {
    rec = { roster: null, selected: [], step: "who", search: "" };
    S(tok, back + `<div class="card">${spinner("Loading applicators…")}</div>`);
    let list = [];
    try { list = (await call("get_applicators_for_block", { block: nav.plan.block })) || []; } catch (e) { list = []; }
    if (tok !== renderToken) return;
    rec.roster = list;
    rec.selected = list.map((a) => a.name);   // the common case is that the whole crew applied it
    drawRecord();
}
function drawRecord() {
    const plan = nav.plan, back = backLink("Back", "plan-back");
    const box = (html) => { $("screen").innerHTML = back + `<div class="card">${html}</div>`; };
    if (rec.step === "qty") return drawRecordForm(back);
    if (!rec.roster.length) {
        box(`<h3>Who applied this?</h3>${empty("No applicators are assigned to " + plan.block + " yet. Assign some under Manage Team, or continue without selecting anyone.")}
            ${btn("Continue", "warn", 'data-act="rec-continue"')}`);
        return;
    }
    const f = rec.search.toLowerCase();
    const rows = rec.roster.filter((a) => a.employee_name.toLowerCase().includes(f));
    box(`<h3>Who applied this?</h3>
        <div class="meta">${esc(plan.block)} · ${esc(productName(plan))} · everyone assigned to this block is pre-selected — adjust if needed</div>
        ${rec.roster.length > 6 ? `<input class="inp" id="rec-search" type="text" placeholder="Search applicators…" value="${esc(rec.search)}" autocomplete="off">` : ""}
        <div id="rec-rows">${rows.length ? rows.map((a) => `
            <div class="row pick ${rec.selected.includes(a.name) ? "sel" : ""}" data-act="rec-toggle" data-emp="${esc(a.name)}">
                <div class="initial">${esc(initials(a.employee_name))}</div><div class="grow"><div class="nm">${esc(a.employee_name)}</div></div>
                <div class="check">${ico("check", 13, "#fafaf6", 3)}</div>
            </div>`).join("") : empty("No matches.")}</div>
        ${btn(rec.selected.length ? `Continue (${rec.selected.length} selected)` : "Select at least one applicator", "warn", 'data-act="rec-continue"', rec.selected.length === 0)}`);
    const s = $("rec-search");
    if (s) { s.oninput = (e) => { rec.search = e.target.value; const pos = e.target.selectionStart; drawRecord(); const n = $("rec-search"); n.focus(); n.setSelectionRange(pos, pos); }; }
}
const METHODS = ["Broadcast", "Branding", "Drip Fertigation", "Foliar Spray", "Other"];
const WEATHER = ["Dry / Sunny", "Light Cloud", "Light Rain", "Wet"];
const opts = (list, cur) => list.map((v) => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
function drawRecordForm(back) {
    const plan = nav.plan;
    $("screen").innerHTML = back + `<div class="card"><h3>Record ${esc(productName(plan))}</h3>
        <div class="meta">${esc(productCode(plan))} · ${esc(plan.block)} · ${esc(plan.application_month)} · ${esc(plan.total_kg_required)} Kg planned</div>
        <label class="lbl">Actual quantity applied (Kg)</label>
        <input class="inp" id="act-qty" type="number" inputmode="decimal" value="${esc(plan.total_kg_required)}">
        <div class="toggle" id="full-row"></div>
        <div id="reason-box" style="display:none"><label class="lbl">Reason it was not done in full</label>
            <input class="inp" id="reason" type="text" placeholder="e.g. ran out of stock"></div>
        <label class="lbl">Application method</label><select class="inp" id="act-method">${opts(METHODS, "Broadcast")}</select>
        <label class="lbl">Weather conditions</label><select class="inp" id="act-weather">${opts(WEATHER, "Dry / Sunny")}</select>
        ${btn("Submit application", "warn", 'id="rec-submit" data-act="rec-submit"')}</div>`;
    $("act-qty").oninput = updateFull;
    updateFull();
}
// "Applied in full" is a fact about the two numbers, not a separate answer -
// the server derives it the same way. The tolerance keeps a rounding
// difference on a 4,000 Kg round from reading as a partial application.
function fullState() {
    const planned = Number(nav.plan.total_kg_required || 0), applied = Number($("act-qty").value);
    const full = !planned || !isFinite(applied) || applied >= planned - Math.max(planned * 0.01, 0.5);
    return { full, planned, applied };
}
function updateFull() {
    const { full, planned, applied } = fullState();
    $("full-row").innerHTML = ico(full ? "check-square" : "square", 22, full ? "var(--good)" : "var(--ink-faint)") +
        `<span>${full ? "Applied in full" : "Partial — " + (planned - applied).toFixed(1) + " Kg short"}</span>`;
    $("reason-box").style.display = full ? "none" : "block";
}
async function submitRecord() {
    const plan = nav.plan, qty = $("act-qty").value, { full } = fullState();
    const reason = full ? "" : ($("reason").value || "").trim();
    if (!full && !reason) { toast("Please give a reason"); return; }
    const ok = await confirmIfWanted("Record this application?",
        `${qty} Kg of ${productName(plan)} on ${plan.block}. This moves stock and cannot be undone from the app.`);
    if (!ok) return;
    const b = $("rec-submit"); b.disabled = true;
    try {
        // Refuse to record against a block the store has not fully issued.
        const sr = await call("get_issued_request_for_plan", { block_fertilizer_plan: plan.name });
        if (!sr) { toast("No fully-issued store request found for this block — check Store Requests before recording."); return; }
        const r = await writeCall("record_application", {
            block_fertilizer_plan: plan.name, actual_quantity: qty, partial_reason: reason,
            material_request: sr, application_method: $("act-method").value,
            weather_conditions: $("act-weather").value, operators: rec.selected,
        });
        toast("Application recorded: " + r.name);
        planBack();
    } catch (err) {
        toast(err.message);
        if (err.queued) planBack();
    } finally { const x = $("rec-submit"); if (x) x.disabled = false; }
}

// A searchable list rendered into a host element, so a back link can sit above it.
function renderPickInto(hostId, tok, items, o) {
    const host = $(hostId);
    if (!items || !items.length) { host.innerHTML = empty(o.emptyText || "Nothing to show."); return; }
    host.innerHTML = `<input class="inp" id="pl-search" type="text" autocomplete="off" autocapitalize="none" placeholder="${esc(o.placeholder || "Search…")}"><div id="pl-list"></div>`;
    const list = $("pl-list");
    const draw = (filter) => {
        const f = (filter || "").toLowerCase();
        const rows = items.map((it, i) => ({ it, i })).filter(({ it }) => o.label(it).toLowerCase().includes(f));
        list.innerHTML = rows.length ? rows.map(({ it, i }) => `
            <div class="row pick" data-i="${i}">
                ${o.sub ? `<div class="initial">${esc(initials(o.label(it)))}</div>` : ""}
                <div class="grow"><div class="nm">${esc(o.label(it))}</div>${o.sub ? `<div class="sub">${esc(o.sub(it) || "")}</div>` : ""}</div>
            </div>`).join("") : empty("No matches.");
    };
    list.onclick = (e) => { const r = e.target.closest(".pick"); if (r) o.select(items[+r.dataset.i]); };
    $("pl-search").oninput = (e) => draw(e.target.value);

let crew = { q: "", rows: null, picked: [], error: null, busy: false, timer: null };
function screenAddApplicators(tok) {

    $("crew-q").oninput = (e) => {

    };

async function crewSearch() {
    const tok = renderToken;
    try {
        const rows = await call("get_available_employees_for_team", { search: crew.q });
        if (nav.view !== "add-employee" || tok !== renderToken) return;
        crew.rows = rows || []; crew.error = null;
    } catch (e) { crew.error = e.message; }
    drawCrew();
}
function drawCrew() {
    if (nav.view !== "add-employee" || !$("crew-matches")) return;
    const isPicked = (e) => crew.picked.some((p) => p.name === e.name);
    $("crew-picked").innerHTML = crew.picked.length ? `<div class="card">
        <div class="crewhead"><h3>Selected · ${crew.picked.length}</h3><button data-act="crew-clear">Clear</button></div>
        ${crew.picked.map((p) => `<div class="row tight" style="box-shadow:none;border-radius:0;border-top:1px solid var(--hairline);padding:9px 0;margin:0">
            <div class="initial" style="width:28px;height:28px;background:var(--bg);color:var(--ink-3)">${ico("users2", 12, "var(--ink-3)")}</div>
            <div class="grow"><div class="nm" style="font-weight:500;font-size:var(--f13)">${esc(p.employee_name)}</div><div class="sub">${esc(p.name)}</div></div>
            <button class="xbtn" data-act="crew-toggle" data-emp="${esc(p.name)}" aria-label="Remove ${esc(p.employee_name)}">${ico("x", 18, "var(--ink-mute)")}</button></div>`).join("")}
    </div>` : "";
    $("crew-matches").innerHTML = `<div class="card"><h3>${crew.q.trim() ? "Matches" : "Available"}</h3>` + (
        crew.rows === null ? spinner("Searching…")
        : crew.error ? empty(crew.error)
        : !crew.rows.length ? empty(crew.q.trim() ? "No one matches that." : "No available employees.")
        : crew.rows.map((e, i) => `<div class="row pick ${isPicked(e) ? "sel" : ""}" data-act="crew-toggle" data-i="${i}" data-emp="${esc(e.name)}">
            <div class="initial">${esc(initials(e.employee_name))}</div>
            <div class="grow"><div class="nm">${esc(e.employee_name)}</div><div class="sub">${esc(e.designation ? e.name + " · " + e.designation : e.name)}</div></div>
            <div class="check">${ico("check", 13, "#fafaf6", 3)}</div></div>`).join("")
    ) + (crew.rows && crew.rows.length >= 50 ? '<div class="meta" style="margin-top:8px">Showing the first 50. Type more of the name to narrow it.</div>' : "") + `</div>`;
    const n = crew.picked.length;
    $("crew-go").innerHTML = btn(crew.busy ? "Adding…" : n ? `Add ${n} applicator${n === 1 ? "" : "s"}` : "Select someone to add",
        n ? "ink" : "grey", 'data-act="crew-add"', crew.busy || !n);
}
function crewToggle(emp) {
    const i = crew.picked.findIndex((p) => p.name === emp);
    if (i >= 0) crew.picked.splice(i, 1);
    else { const row = (crew.rows || []).find((r) => r.name === emp); if (row) crew.picked.push(row); }
    drawCrew();
}
async function crewAdd() {
    if (crew.busy || !crew.picked.length) return;
    crew.busy = true; drawCrew();
    try {
        const res = await writeCall("add_applicators", { employees: crew.picked.map((p) => p.name), block: nav.pickedBlock || null });
        const n = (res && res.added && res.added.length) || crew.picked.length;
        // Say what did not work as well as what did.
        if (res && res.failed && res.failed.length) toast(`${n} added. ${res.failed.length} skipped: ${res.failed[0].reason}.`);
        else toast(`${n} applicator${n === 1 ? "" : "s"} added${nav.pickedBlock ? " to " + nav.pickedBlock : ""}.`);
        go({ view: "team" });
    } catch (err) {
        toast(err.message);
        if (err.queued) go({ view: "team" });
    } finally { crew.busy = false; drawCrew(); }
}

    "crew-add": () => crewAdd(),
    font: (el) => {
        const s = getSettings(), next = Math.min(FONT_MAX, Math.max(FONT_MIN, s.fontScale + Number(el.dataset.by)));
        if (next !== s.fontScale) { s.fontScale = next; saveSettings(s); syncFontButtons(); }
    },
    "sync-now": () => syncNow(true).then(() => render()),
    "reset-settings": () => { store.del(SETTINGS_KEY); applySettings(); render(); toast("Display settings reset"); },
    "reload-page": () => location.reload(),
    ping: async (el) => {
        el.disabled = true; el.textContent = "Pinging…"; $("ping-out").textContent = "Pinging…";
        const r = await pingServer();
        $("ping-out").textContent = r.ok ? `Reachable — HTTP ${r.status} in ${r.ms}ms` : `Unreachable after ${r.ms}ms — ${r.error}`;
        el.disabled = false; el.textContent = "Ping server"; checkConnection(); paintLog();
    },
    "clear-log": () => { debugLog.length = 0; paintLog(); },
    recheck: () => { setConn("checking"); checkConnection(); },
    "open-howto": () => openHowTo(),
    "close-howto": () => closeHowTo(),
    "howto-next": () => { if (howPage === LESSONS.length - 1) closeHowTo(); else howGo(howPage + 1); },
    "how-dot": (el) => howGo(Number(el.dataset.i)),
    "open-news": () => openNews(),
    "close-news": () => closeNews(),
    "news-next": () => { if (newsPage === NEWS.length - 1) closeNews(); else newsGo(newsPage + 1); },
    "news-prev": () => newsGo(newsPage - 1),
    "news-dot": (el) => newsGo(Number(el.dataset.i)),
    "ask-logout": async () => {
        hideDrawer();
        const yes = await confirmDialog("Log out?", `You are signed in as ${USER}. You'll need your email and password to get back in.`, "Log out");
        if (yes) doLogout();
    },
    "confirm-yes": () => closeConfirm(true),
    "confirm-no": () => closeConfirm(false),
};
document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
});
document.addEventListener("change", (e) => {
    const el = e.target.closest("[data-change]");
    if (!el) return;
    switch (el.dataset.change) {
        case "programme": saveProgrammeSelection(el.value); bump(); break;
        case "plan-filter": drawPlanRows(); break;
        case "setting": { const s = getSettings(); s[el.dataset.key] = el.checked; saveSettings(s); break; }
    }
});
$("howto-slides").addEventListener("scroll", () => {
    const el = $("howto-slides"), p = Math.round(el.scrollLeft / el.clientWidth);
    if (p !== howPage && p >= 0 && p < LESSONS.length) { howPage = p; paintHow(); }
});

/* ------------------------------------------------------------ Boot */
function renderBottomNav() {
    $("bottom-nav").innerHTML = BOTTOM_NAV.map(([v, icon, label]) =>
        `<button data-act="go" data-view="${v}" aria-label="${label}">${ico(icon, 20)}<span>${label}</span></button>`).join("");
}
window.addEventListener("load", () => {
    $("ico-help").innerHTML = ico("help-circle", 14, "var(--good)");
    $("ico-gift").innerHTML = ico("gift", 14, "var(--info)");
    $("ico-logout").innerHTML = ico("log-out", 14, "var(--bad)");
    $("ico-x1").innerHTML = ico("x", 22, "var(--ink-3)");
    $("ico-x2").innerHTML = ico("x", 20, "#ffffff88");
    $("drawer-foot").innerHTML = `Signed in as ${esc(USER).replace("@", "@<wbr>")}<br>${APP_TITLE} v${APP_VERSION}`;
    renderBottomNav();
    applySettings();
    updateSyncBadge();
    history.replaceState({ n: 1 }, "");
    render();
    flushQueue().then((n) => { if (n) { toast(n + " pending item" + (n > 1 ? "s" : "") + " synced"); refreshView(); } updateSyncBadge(); });
    checkConnection();
    // Surface the changelog once per release, on the first screen after sign-in.
    if (newsUnseen()) { $("news-dot").style.display = "block"; setTimeout(openNews, 600); }
});
</script>
</body>
</html>
